name: Build Gopeed AAR
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: android-actions/setup-android@v3
      - name: Setup NDK & gomobile
        run: |
          sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
      - name: Build AAR
        run: |
          gomobile bind -tags nosqlite -ldflags="-w -s -checklinkname=0" -javapkg="com.gopeed" -target=android/arm64 -androidapi 21 -o libgopeed.aar ./bind/mobile
      - uses: actions/upload-artifact@v4
        with:
          name: libgopeed-aar
          path: libgopeed.aar
