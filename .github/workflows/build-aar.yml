name: Build Gopeed AAR
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v1.9.3
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Setup NDK & gomobile
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.3.11579264"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.3.11579264" >> $GITHUB_ENV
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
      - name: Build AAR
        env:
          CGO_ENABLED: 1
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          gomobile bind -tags nosqlite -ldflags="-w -s -checklinkname=0" -o libgopeed.aar -target=android/arm64 -androidapi 21 -javapkg="com.gopeed" ://github.com
      - uses: actions/upload-artifact@v4
        with:
          name: libgopeed-aar
          path: libgopeed.aar
